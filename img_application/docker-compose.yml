version: '3.8'

services:
  # 1. MongoDB Database
  database:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Node.js Backend
  backend:
    build: ./Backend      
          
    ports:
      - "5000:5000"
    environment:
      # Tomar code-er exact variable name (DATABASE_URI) ekhane dite hobe
      - DATABASE_URI=mongodb://database:27017/img_application_db
    depends_on:
      - database
      

  # 3. Vite React Frontend
  frontend:
    build: ./Frontend/app_frontend  # Frontend folder-er vitorer Dockerfile nibe
    ports:
      - "5173:5173"
    environment:
      # Vite frontend-ke janiye dewa je backend kothay aache
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data: